<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent MCP System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: 80vh;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        h2 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mcp-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
        }

        .mcp-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .mcp-item h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .mcp-item p {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .mcp-item button {
            margin-top: 8px;
            background: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }

        .message.assistant {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            font-size: 13px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
        }

        .chat-input button {
            width: auto;
            padding: 12px 32px;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- MCP Management Panel -->
        <div class="panel">
            <h1>🔧 MCP Endpoints</h1>

            <div class="form-group">
                <label for="mcpName">Name</label>
                <input type="text" id="mcpName" placeholder="e.g., weather">
            </div>

            <div class="form-group">
                <label for="mcpUrl">URL</label>
                <input type="text" id="mcpUrl" placeholder="http://127.0.0.1:8003/mcp">
            </div>

            <div class="form-group">
                <label for="mcpDescription">Description</label>
                <textarea id="mcpDescription" placeholder="What does this MCP do?"></textarea>
            </div>

            <button onclick="addMCP()">➕ Add MCP</button>

            <div id="mcpStatus" class="status hidden"></div>

            <h2 style="margin-top: 20px;">Available MCPs</h2>
            <div class="mcp-list" id="mcpList">
                <p style="color: #999; text-align: center;">Loading...</p>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="panel chat-panel">
            <h1>💬 Chat with Agent</h1>

            <div class="messages" id="messages">
                <div class="message system">
                    Welcome! I'm your multi-agent assistant. I can help with Notion, filesystem tasks, and dynamic MCP
                    endpoints.
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // Load MCPs on page load
        window.onload = function () {
            loadMCPs();
        };

        async function loadMCPs() {
            try {
                const response = await fetch(`${API_BASE}/mcps`);
                const mcps = await response.json();

                const listDiv = document.getElementById('mcpList');
                listDiv.innerHTML = '';

                if (Object.keys(mcps).length === 0) {
                    listDiv.innerHTML = '<p style="color: #999; text-align: center;">No MCPs configured</p>';
                    return;
                }

                for (const [name, config] of Object.entries(mcps)) {
                    const div = document.createElement('div');
                    div.className = 'mcp-item';
                    div.innerHTML = `
                        <h3>${name}</h3>
                        <p><strong>URL:</strong> ${config.url}</p>
                        <p><strong>Description:</strong> ${config.description || 'No description'}</p>
                        <button onclick="removeMCP('${name}')"> Remove</button>
                    `;
                    listDiv.appendChild(div);
                }
            } catch (error) {
                console.error('Error loading MCPs:', error);
                showStatus('mcpStatus', 'Error loading MCPs', 'error');
            }
        }

        async function addMCP() {
            const name = document.getElementById('mcpName').value.trim();
            const url = document.getElementById('mcpUrl').value.trim();
            const description = document.getElementById('mcpDescription').value.trim();

            if (!name || !url) {
                showStatus('mcpStatus', 'Name and URL are required', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/mcps/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        transport: 'streamable_http',
                        url,
                        description
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('mcpStatus', 'MCP added successfully!', 'success');
                    document.getElementById('mcpName').value = '';
                    document.getElementById('mcpUrl').value = '';
                    document.getElementById('mcpDescription').value = '';
                    loadMCPs();
                } else {
                    showStatus('mcpStatus', result.detail || 'Error adding MCP', 'error');
                }
            } catch (error) {
                console.error('Error adding MCP:', error);
                showStatus('mcpStatus', 'Error adding MCP', 'error');
            }
        }

        async function removeMCP(name) {
            if (!confirm(`Remove MCP "${name}"?`)) return;

            try {
                const response = await fetch(`${API_BASE}/mcps/remove/${name}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('mcpStatus', 'MCP removed successfully!', 'success');
                    loadMCPs();
                } else {
                    showStatus('mcpStatus', result.detail || 'Error removing MCP', 'error');
                }
            } catch (error) {
                console.error('Error removing MCP:', error);
                showStatus('mcpStatus', 'Error removing MCP', 'error');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to chat
            addMessageToChat('user', message);
            input.value = '';

            // Add thinking indicator
            const thinkingId = addMessageToChat('system', '🤔 Processing...');

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();

                // Remove thinking indicator
                document.getElementById(thinkingId).remove();

                if (response.ok) {
                    addMessageToChat('assistant', result.response);
                } else {
                    addMessageToChat('system', `Error: ${result.detail || 'Unknown error'}`);
                }
            } catch (error) {
                document.getElementById(thinkingId).remove();
                console.error('Error sending message:', error);
                addMessageToChat('system', 'Error: Could not connect to server');
            }
        }

        function addMessageToChat(type, content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageId;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.classList.remove('hidden');

            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>

</html>
